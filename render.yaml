services:
  - type: web
    name: qa-studio
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    numInstances: 1
    autoDeploy: true
    buildCache:
      paths:
        - /opt/render/.cache/ms-playwright
        - node_modules
